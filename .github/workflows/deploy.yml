name: Deploy to GitHub Pages

on:
  # Se ejecuta automáticamente en cada push a la rama main
  push:
    branches: [ main ]
  # Permite ejecutar el despliegue manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos necesarios para GitHub Pages y GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos en conflicto
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias, compilar y preparar artefacto Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
